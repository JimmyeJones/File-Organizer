services:
  astro-planner:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: astro-planner:latest
    container_name: astro-planner
    ports:
      - "${ASTRO_PORT:-8000}:8000"
    environment:
      ASTRO_DATA_DIR: /data
      ASTRO_EPHEMERIS_DIR: /ephemeris
    volumes:
      # Only sites (user data) needs to persist across rebuilds.
      # Ephemeris is baked into the image at /ephemeris.
      - astro-sites:/data/sites
    restart: unless-stopped

volumes:
  astro-sites:
