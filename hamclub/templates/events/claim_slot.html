{% extends "base.html" %}
{% block title %}Volunteer — {{ meeting.title }}{% endblock %}
{% block content %}
<h1>Volunteer for a Presentation Slot</h1>
<p class="text-muted lead">{{ meeting.title }} &mdash; {{ meeting.date|date:"F j, Y" }}</p>

<div class="row">
  <div class="col-md-6">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="id_topic">Topic <span class="text-muted">(optional)</span></label>
        {{ form.topic }}
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_description">Description <span class="text-muted">(optional)</span></label>
        {{ form.description }}
      </div>
      <button type="submit" class="btn btn-success">Claim Slot</button>
      <a href="{% url 'meeting_detail' meeting.pk %}" class="btn btn-link">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
