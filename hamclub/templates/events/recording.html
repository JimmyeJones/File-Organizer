{% extends "base.html" %}
{% block title %}Recording — {{ meeting.title }}{% endblock %}
{% block content %}
<h1>{{ meeting.title }}</h1>
<p class="text-muted">{{ meeting.date|date:"F j, Y" }}</p>

<div class="ratio ratio-16x9 mb-3">
  <video controls>
    <source src="{{ meeting.recording.url }}">
    Your browser does not support the video tag.
  </video>
</div>

<a href="{{ meeting.recording.url }}" class="btn btn-outline-secondary btn-sm" download>Download recording</a>
<a href="{% url 'meeting_detail' meeting.pk %}" class="btn btn-link">&larr; Back to meeting</a>
{% endblock %}
