{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <h1 class="mb-3">Log In</h1>
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}
        <div class="alert alert-danger">Incorrect username or password.</div>
      {% endif %}
      <div class="mb-3">
        <label class="form-label" for="id_username">Username</label>
        <input class="form-control" id="id_username" name="username" type="text" autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_password">Password</label>
        <input class="form-control" id="id_password" name="password" type="password">
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-100">Log In</button>
    </form>
    <p class="mt-3 text-muted small">Not a member yet? <a href="{% url 'register' %}">Apply to join</a>.</p>
  </div>
</div>
{% endblock %}
